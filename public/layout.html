<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="/css/exam.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <span class="brand-icon-wrap" aria-hidden="true">🎓</span>
      <div class="brand-info">
        <div class="brand-name">Thi trực tuyến <span class="brand-sep">·</span> <span class="brand-link">Quản trị</span></div>
        <div class="header-status">Hệ thống ổn định</div>
      </div>
    </div>
    <div class="header-right">
      <div class="user-avatar" id="adminAvatar" title="{{NAME}}">A</div>
      <form method="post" action="/admin/action" style="margin:0;display:inline-flex;">
        <input type="hidden" name="action" value="logout">
        <button type="submit" class="logout-pill-btn" title="Đăng xuất">
          <span class="logout-icon">⎋</span>
          <span class="logout-text">Đăng xuất</span>
        </button>
      </form>
    </div>
  </header>
  <main>{{BODY}}</main>
  <script>
    window.addEventListener('pageshow', function(event) {
      if (event.persisted) window.location.reload();
    });
    (function() {
      const el = document.getElementById('adminAvatar');
      if (!el) return;
      const name = (el.getAttribute('title') || '').trim();
      const parts = name.split(/\s+/).filter(Boolean);
      el.textContent = parts.length >= 2
        ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
        : (name[0] || 'A').toUpperCase();
    })();

    function runInlineScripts(container) {
      container.querySelectorAll('script').forEach(oldScript => {
        const script = document.createElement('script');
        script.textContent = oldScript.textContent;
        oldScript.replaceWith(script);
      });
    }

    document.addEventListener('submit', async function(event) {
      const form = event.target;
      if (!(form instanceof HTMLFormElement) || form.method.toLowerCase() !== 'post' || form.action !== location.origin + '/admin/action') return;
      if (form.querySelector('[name="action"]')?.value === 'logout') return;

      event.preventDefault();
      const button = form.querySelector('button[type="submit"], button:not([type])');
      if (button?.disabled) return;
      if (button) button.disabled = true;

      try {
        const response = await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { 'X-Requested-With': 'XMLHttpRequest' } });
        if (!response.ok) throw new Error('Không thể hoàn thành thao tác.');
        const page = new DOMParser().parseFromString(await response.text(), 'text/html');
        const nextMain = page.querySelector('main');
        if (!nextMain) throw new Error('Không thể cập nhật nội dung trang.');
        document.querySelector('main').innerHTML = nextMain.innerHTML;
        history.replaceState({}, '', new URL(response.url).pathname + new URL(response.url).search);
        runInlineScripts(document.querySelector('main'));
      } catch (error) {
        alert(error.message || 'Không thể hoàn thành thao tác. Hãy thử lại.');
        if (button) button.disabled = false;
      }
    });
  </script>
</body>
</html>
