<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập quản trị · Thi trực tuyến</title>
  <link rel="stylesheet" href="/css/exam.css">
  <style>
    body {
      background: linear-gradient(135deg, #ede9fe 0%, #f0fdf4 50%, #f8fafc 100%);
      min-height: 100vh;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <main class="login-page">
    <div class="login-brand">
      <span class="login-brand-mark" aria-hidden="true">🎓</span>
      <h1>Thi trực tuyến</h1>
      <p>Cổng quản trị hệ thống</p>
    </div>

    <section class="card login-card">
      <h2>Đăng nhập quản trị</h2>
      <p>Nhập thông tin tài khoản quản trị để tiếp tục.</p>
      {{ERROR}}
      <form method="post" action="/login" autocomplete="on">
        <label for="ten_dang_nhap">Tên đăng nhập</label>
        <input id="ten_dang_nhap" name="ten_dang_nhap" autocomplete="username" placeholder="Nhập tên đăng nhập..." required autofocus>
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        <button type="submit">Đăng nhập</button>
      </form>
    </section>
  </main>
</body>
</html>
